name: Secrets Practice

on: workflow_dispatch

jobs:
  secret-demo:
    runs-on: ubuntu-latest

    env:
      PRACTICE_SECRET: ${{ secrets.PRACTICE_SECRET }}

    steps:
      - name: Check Secret
        run: |
          if [ -n "$PRACTICE_SECRET" ]; then
            echo "Secret is configured"
          else
            echo "Secret is missing"
            exit 1
          fi
